<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal - Dashboard</title>
    <!-- Simple styling for the table -->
    <style>
        body { font-family: sans-serif; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .form-group { margin-bottom: 10px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>My Trading Journal 📈</h1>
    <button id="logoutBtn">Logout</button>

    <hr>

    <!-- ADD TRADE FORM -->
    <h3>Add New Trade</h3>
    <form id="addTradeForm">
        <div class="form-group">
            <input type="text" id="symbol" placeholder="Symbol (e.g. BTCUSD)" required>
            <select id="trade_type">
                <option value="LONG">LONG</option>
                <option value="SHORT">SHORT</option>
            </select>
            <input type="number" id="quantity" placeholder="Quantity" step="0.01" required>
            <input type="number" id="entry_price" placeholder="Entry Price" step="0.01" required>
        </div>
        <div class="form-group">
            <input type="text" id="notes" placeholder="Notes (optional)">
        </div>
        <button type="submit">Log Trade</button>
        <p id="formMessage" class="error"></p>
    </form>

    <hr>

    <!-- TRADES TABLE -->
    <h3>Recent Trades</h3>
    <table id="tradesTable">
        <thead>
            <tr>
                <th>Date</th>
                <th>Symbol</th>
                <th>Type</th>
                <th>Entry</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be injected here by JS -->
        </tbody>
    </table>

    <script src="../js/dashboard.js"></script>
    
</body>
</html>
